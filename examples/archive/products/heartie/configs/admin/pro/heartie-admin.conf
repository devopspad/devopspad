server {
    listen 443 ssl;
    server_name admin.heartie.example;
    ssl_certificate     /etc/nginx/certs/heartie.example/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/heartie.example/key.pem;

    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;
    }
}
