name: Verify desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: make test
      - name: Build unsigned desktop package
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/devopspad.app build/DevOpsPad-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DevOpsPad-macos-${{ runner.arch }}-unsigned
          path: build/DevOpsPad-macos.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
          retention-days: 7
